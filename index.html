<body class="loading">

  <!-- Network Initialization Intro -->
  <div id="preloader" style="position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; opacity:1; transition:opacity 0.8s ease;">
    <div style="font-family:var(--font-mono); color:var(--muted); font-size:0.8rem; margin-bottom:40px; letter-spacing:0.1em; height:20px;" id="preloader-text">NETWORK INITIALIZING...</div>
    
    <div class="preloader-network" style="position:relative; width:80vw; max-width:800px; height:150px; display:flex; justify-content:space-between; align-items:center;">
      <svg class="preloader-lines" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;">
        <line x1="10%" y1="50%" x2="30%" y2="50%" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4" opacity="0.3" id="line-1"></line>
        <line x1="30%" y1="50%" x2="50%" y2="50%" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4" opacity="0.3" id="line-2"></line>
        <line x1="50%" y1="50%" x2="70%" y2="50%" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4" opacity="0.3" id="line-3"></line>
        <line x1="70%" y1="50%" x2="90%" y2="50%" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4" opacity="0.3" id="line-4"></line>
      </svg>
      
      <!-- Nodes will be injected by script.js using network-assets.js icons -->
      <div class="intro-node" id="node-router" style="position:absolute; top:50%; left:10%; transform:translate(-50%, -50%) scale(0.9); z-index:2; opacity:0.2; color:var(--muted); transition:all 0.3s;"></div>
      <div class="intro-node" id="node-switch" style="position:absolute; top:50%; left:30%; transform:translate(-50%, -50%) scale(0.9); z-index:2; opacity:0.2; color:var(--muted); transition:all 0.3s;"></div>
      <div class="intro-node" id="node-firewall" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%) scale(0.9); z-index:2; opacity:0.2; color:var(--muted); transition:all 0.3s;"></div>
      <div class="intro-node" id="node-server" style="position:absolute; top:50%; left:70%; transform:translate(-50%, -50%) scale(0.9); z-index:2; opacity:0.2; color:var(--muted); transition:all 0.3s;"></div>
      <div class="intro-node" id="node-cloud" style="position:absolute; top:50%; left:90%; transform:translate(-50%, -50%) scale(0.9); z-index:2; opacity:0.2; color:var(--muted); transition:all 0.3s;"></div>

      <!-- Packets -->
      <div class="intro-packet" id="packet-1" style="position:absolute; top:50%; left:10%; width:8px; height:8px; background:var(--accent); border-radius:50%; transform:translate(-50%, -50%); opacity:0; z-index:3; box-shadow:0 0 10px var(--accent);"></div>
      <div class="intro-packet" id="packet-2" style="position:absolute; top:50%; left:30%; width:8px; height:8px; background:var(--accent2); border-radius:50%; transform:translate(-50%, -50%); opacity:0; z-index:3; box-shadow:0 0 10px var(--accent2);"></div>
      <div class="intro-packet" id="packet-3" style="position:absolute; top:50%; left:50%; width:8px; height:8px; background:var(--accent); border-radius:50%; transform:translate(-50%, -50%); opacity:0; z-index:3; box-shadow:0 0 10px var(--accent);"></div>
      <div class="intro-packet" id="packet-4" style="position:absolute; top:50%; left:70%; width:8px; height:8px; background:var(--accent2); border-radius:50%; transform:translate(-50%, -50%); opacity:0; z-index:3; box-shadow:0 0 10px var(--accent2);"></div>
    </div>
  </div>

        </nav>
      </div>
      <div class="dashboard-main">

          <h2 id="current-tab-title">Identity</h2>
          <div class="header-actions">
             <button id="close-dashboard" class="close-btn">&times;</button>

        </div>
        <div class="modal-body" id="dashboard-forms">
